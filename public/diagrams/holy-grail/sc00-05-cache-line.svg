<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="'Geist Mono', monospace">
  <rect width="680" height="260" fill="#0f0d09"/>

  <!-- Title -->
  <text x="340" y="16" text-anchor="middle" fill="#92400e" font-size="10" letter-spacing="2" font-weight="700">CACHE LINE — 64 BYTES FETCHED ON EVERY MISS</text>

  <!-- Memory layout label -->
  <text x="22" y="34" fill="#3d2e0f" font-size="9">MEMORY (arr[int], 4 bytes each)</text>
  <text x="22" y="44" fill="#3d2e0f" font-size="8">Address → 0x1000</text>

  <!-- 16 int cells forming one cache line, starting at x=22, each 40px wide -->
  <!-- Highlighted cells (the "requested" cell arr[5] and its neighbors) -->

  <!-- Cell template: 40px wide, 40px tall, starting y=50 -->
  <!-- arr[0]..arr[15] form one 64-byte cache line -->

  <!-- Cache line bracket -->
  <rect x="22" y="50" width="636" height="52" rx="4" fill="#1f1608" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="48" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">← one 64-byte cache line (addresses 0x1000–0x103F) →</text>

  <!-- 16 individual cells inside the cache line -->
  <!-- Each cell: 39px wide (with 1px gap), y=52, height=48 -->
  <!-- Cells arr[0]..arr[4]: cold -->
  <rect x="24"  y="52" width="38" height="46" rx="2" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="43"  y="72" text-anchor="middle" fill="#3d2e0f" font-size="9">arr[0]</text>
  <text x="43"  y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">0x00</text>

  <rect x="64"  y="52" width="38" height="46" rx="2" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="83"  y="72" text-anchor="middle" fill="#3d2e0f" font-size="9">arr[1]</text>
  <text x="83"  y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">0x04</text>

  <rect x="104" y="52" width="38" height="46" rx="2" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="123" y="72" text-anchor="middle" fill="#3d2e0f" font-size="9">arr[2]</text>
  <text x="123" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">0x08</text>

  <rect x="144" y="52" width="38" height="46" rx="2" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="163" y="72" text-anchor="middle" fill="#3d2e0f" font-size="9">arr[3]</text>
  <text x="163" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">0x0C</text>

  <rect x="184" y="52" width="38" height="46" rx="2" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="203" y="72" text-anchor="middle" fill="#3d2e0f" font-size="9">arr[4]</text>
  <text x="203" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">0x10</text>

  <!-- arr[5]: the requested cell (highlighted in amber) -->
  <rect x="224" y="52" width="38" height="46" rx="2" fill="#2a1f08" stroke="#f59e0b" stroke-width="2"/>
  <text x="243" y="68" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">arr[5]</text>
  <text x="243" y="80" text-anchor="middle" fill="#f59e0b" font-size="8">← READ</text>
  <text x="243" y="92" text-anchor="middle" fill="#f59e0b" font-size="8">0x14</text>

  <!-- arr[6]..arr[15]: free ride (green, they arrive with the line) -->
  <rect x="264" y="52" width="38" height="46" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="283" y="72" text-anchor="middle" fill="#4ade80" font-size="9">arr[6]</text>
  <text x="283" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">free</text>

  <rect x="304" y="52" width="38" height="46" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="323" y="72" text-anchor="middle" fill="#4ade80" font-size="9">arr[7]</text>
  <text x="323" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">free</text>

  <rect x="344" y="52" width="38" height="46" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="363" y="72" text-anchor="middle" fill="#4ade80" font-size="9">arr[8]</text>
  <text x="363" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">free</text>

  <rect x="384" y="52" width="38" height="46" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="403" y="72" text-anchor="middle" fill="#4ade80" font-size="9">arr[9]</text>
  <text x="403" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">free</text>

  <rect x="424" y="52" width="38" height="46" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="443" y="72" text-anchor="middle" fill="#4ade80" font-size="9">arr[10]</text>
  <text x="443" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">free</text>

  <rect x="464" y="52" width="38" height="46" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="483" y="72" text-anchor="middle" fill="#4ade80" font-size="9">arr[11]</text>
  <text x="483" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">free</text>

  <rect x="504" y="52" width="38" height="46" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="523" y="72" text-anchor="middle" fill="#4ade80" font-size="9">arr[12]</text>
  <text x="523" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">free</text>

  <rect x="544" y="52" width="38" height="46" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="563" y="72" text-anchor="middle" fill="#4ade80" font-size="9">arr[13]</text>
  <text x="563" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">free</text>

  <rect x="584" y="52" width="38" height="46" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="603" y="72" text-anchor="middle" fill="#4ade80" font-size="9">arr[14]</text>
  <text x="603" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">free</text>

  <rect x="624" y="52" width="34" height="46" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="641" y="72" text-anchor="middle" fill="#4ade80" font-size="9">arr[15]</text>
  <text x="641" y="85" text-anchor="middle" fill="#3d2e0f" font-size="8">free</text>

  <!-- Legend -->
  <rect x="22"  y="114" width="12" height="12" rx="2" fill="#2a1f08" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="40"  y="124" fill="#f59e0b" font-size="9">requested element (triggers 100 ns miss)</text>
  <rect x="260" y="114" width="12" height="12" rx="2" fill="#0f1a0f" stroke="#4ade80" stroke-width="1"/>
  <text x="278" y="124" fill="#4ade80" font-size="9">loaded for free — already in L1 for next accesses</text>

  <!-- Divider -->
  <line x1="22" y1="135" x2="658" y2="135" stroke="#3d2e0f" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Sequential vs Random comparison -->
  <text x="22" y="152" fill="#92400e" font-size="9" letter-spacing="1" font-weight="700">SEQUENTIAL ACCESS (row-major)</text>
  <text x="22" y="168" fill="#fef3c7" font-size="10">arr[0], arr[1], arr[2] ... arr[15]  →  1 miss, then 15 L1 hits</text>
  <text x="22" y="184" fill="#4ade80" font-size="10" font-weight="700">~6 ns/element average  (1 RAM fetch × 100 ns ÷ 16 elements)</text>

  <text x="22" y="208" fill="#92400e" font-size="9" letter-spacing="1" font-weight="700">RANDOM ACCESS</text>
  <text x="22" y="224" fill="#fef3c7" font-size="10">arr[7841], arr[12], arr[99203] ...  →  1 miss per access</text>
  <text x="22" y="240" fill="#f87171" font-size="10" font-weight="700">~100 ns/element  (every access goes to RAM)</text>

  <!-- Bottom ratio -->
  <text x="340" y="256" text-anchor="middle" fill="#3d2e0f" font-size="9" letter-spacing="1">SAME O(n) COMPLEXITY  ·  SAME DATA  ·  ≈15× PERFORMANCE GAP</text>
</svg>
