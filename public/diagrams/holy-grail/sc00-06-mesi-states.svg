<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="'Geist Mono', monospace">
  <rect width="680" height="300" fill="#0f0d09"/>

  <!-- Title -->
  <text x="340" y="16" text-anchor="middle" fill="#92400e" font-size="10" letter-spacing="2" font-weight="700">MESI CACHE COHERENCE PROTOCOL — FOUR STATES</text>

  <!-- Four state boxes, arranged in a 2×2 grid -->
  <!-- M: top-left -->
  <rect x="22" y="28" width="290" height="80" rx="4" fill="#1a0f0f" stroke="#f87171" stroke-width="1.5"/>
  <text x="167" y="48" text-anchor="middle" fill="#f87171" font-size="14" font-weight="700">M — MODIFIED</text>
  <text x="167" y="64" text-anchor="middle" fill="#fef3c7" font-size="9">This core has the only copy.</text>
  <text x="167" y="77" text-anchor="middle" fill="#fef3c7" font-size="9">Value differs from RAM (dirty).</text>
  <text x="167" y="90" text-anchor="middle" fill="#f87171" font-size="8">Must write back to RAM before another core can read.</text>

  <!-- E: top-right -->
  <rect x="368" y="28" width="290" height="80" rx="4" fill="#0f1a0f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="513" y="48" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">E — EXCLUSIVE</text>
  <text x="513" y="64" text-anchor="middle" fill="#fef3c7" font-size="9">This core has the only copy.</text>
  <text x="513" y="77" text-anchor="middle" fill="#fef3c7" font-size="9">Value matches RAM (clean).</text>
  <text x="513" y="90" text-anchor="middle" fill="#4ade80" font-size="8">Can write without broadcasting — transitions to M silently.</text>

  <!-- S: bottom-left -->
  <rect x="22" y="120" width="290" height="80" rx="4" fill="#1f1608" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="167" y="140" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="700">S — SHARED</text>
  <text x="167" y="156" text-anchor="middle" fill="#fef3c7" font-size="9">Multiple cores may hold a copy.</text>
  <text x="167" y="169" text-anchor="middle" fill="#fef3c7" font-size="9">All copies match RAM (clean).</text>
  <text x="167" y="182" text-anchor="middle" fill="#f59e0b" font-size="8">Must invalidate all others before writing (RFO broadcast).</text>

  <!-- I: bottom-right -->
  <rect x="368" y="120" width="290" height="80" rx="4" fill="#120e08" stroke="#3d2e0f" stroke-width="1.5"/>
  <text x="513" y="140" text-anchor="middle" fill="#3d2e0f" font-size="14" font-weight="700">I — INVALID</text>
  <text x="513" y="156" text-anchor="middle" fill="#92400e" font-size="9">No valid data. Slot is empty</text>
  <text x="513" y="169" text-anchor="middle" fill="#92400e" font-size="9">or data was invalidated by another core.</text>
  <text x="513" y="182" text-anchor="middle" fill="#3d2e0f" font-size="8">Next access → cache miss → fetch from L3 or RAM.</text>

  <!-- Key transitions (arrows as text-based descriptions) -->
  <line x1="22" y1="215" x2="658" y2="215" stroke="#3d2e0f" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="340" y="228" text-anchor="middle" fill="#92400e" font-size="9" letter-spacing="1" font-weight="700">KEY TRANSITIONS (what triggers the cross-core overhead)</text>

  <!-- Transition 1: Write to S or E line → RFO -->
  <rect x="22" y="235" width="305" height="24" rx="2" fill="#1a1510"/>
  <text x="28" y="251" fill="#f59e0b" font-size="9" font-weight="700">S/E → M:</text>
  <text x="90" y="251" fill="#fef3c7" font-size="9">core broadcasts RFO, all others → I</text>

  <!-- Transition 2: Another core reads M → S -->
  <rect x="353" y="235" width="305" height="24" rx="2" fill="#1a1510"/>
  <text x="359" y="251" fill="#f87171" font-size="9" font-weight="700">M → S:</text>
  <text x="408" y="251" fill="#fef3c7" font-size="9">write-back to RAM, share with requester</text>

  <!-- Transition 3: Ping-pong cost -->
  <rect x="22" y="263" width="636" height="28" rx="2" fill="#1f1608" stroke="#f59e0b" stroke-width="1"/>
  <text x="340" y="275" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="700">PING-PONG: Core A writes → M.  Core B writes → RFO → A's copy → I.  B → M.  A writes → RFO...</text>
  <text x="340" y="288" text-anchor="middle" fill="#f87171" font-size="9">Each bounce: tens to hundreds of cycles.  Uncontended write: ~1 cycle.  Contended: ~100–300 cycles.</text>
</svg>
