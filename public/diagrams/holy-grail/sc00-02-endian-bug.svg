<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" font-family="'Geist Mono', monospace">
  <rect width="680" height="240" fill="#0f0d09"/>

  <!-- Title -->
  <text x="340" y="20" text-anchor="middle" fill="#92400e" font-size="10" letter-spacing="2" font-weight="700">THE ENDIANNESS BUG — PORT 53 ON THE WIRE</text>

  <!-- The 4 bytes as received from the network -->
  <text x="340" y="44" text-anchor="middle" fill="#92400e" font-size="9">bytes arriving from network (big-endian, transmission order →)</text>

  <rect x="130" y="52" width="100" height="44" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="180" y="70" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700">0x00</text>
  <text x="180" y="86" text-anchor="middle" fill="#3d2e0f" font-size="8">byte 0</text>

  <rect x="240" y="52" width="100" height="44" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="290" y="70" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700">0x00</text>
  <text x="290" y="86" text-anchor="middle" fill="#3d2e0f" font-size="8">byte 1</text>

  <rect x="350" y="52" width="100" height="44" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="400" y="70" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700">0x00</text>
  <text x="400" y="86" text-anchor="middle" fill="#3d2e0f" font-size="8">byte 2</text>

  <rect x="460" y="52" width="100" height="44" rx="4" fill="#1f1608" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510" y="70" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">0x35</text>
  <text x="510" y="86" text-anchor="middle" fill="#92400e" font-size="8">byte 3 = 53₁₀</text>

  <!-- Two paths diverge -->
  <!-- Left path: correct (big-endian read) -->
  <line x1="230" y1="110" x2="190" y2="140" stroke="#4ade80" stroke-width="1.5"/>
  <text x="155" y="136" fill="#4ade80" font-size="9">big-endian read</text>
  <text x="130" y="148" fill="#4ade80" font-size="9">(DataInputStream)</text>

  <rect x="90" y="155" width="190" height="44" rx="4" fill="#0f1a0f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="185" y="174" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">port = 53</text>
  <text x="185" y="189" text-anchor="middle" fill="#4ade80" font-size="9">DNS  ✓  correct</text>

  <!-- Right path: wrong (little-endian read) -->
  <line x1="450" y1="110" x2="490" y2="140" stroke="#f87171" stroke-width="1.5"/>
  <text x="452" y="136" fill="#f87171" font-size="9">little-endian read</text>
  <text x="462" y="148" fill="#f87171" font-size="9">(raw ByteBuffer)</text>

  <rect x="400" y="155" width="220" height="44" rx="4" fill="#1a0f0f" stroke="#f87171" stroke-width="1.5"/>
  <text x="510" y="174" text-anchor="middle" fill="#f87171" font-size="11" font-weight="700">port = 889,192,448</text>
  <text x="510" y="189" text-anchor="middle" fill="#f87171" font-size="9">0x35000000  ✗  corrupt</text>

  <!-- Bottom explanation -->
  <line x1="40" y1="212" x2="640" y2="212" stroke="#3d2e0f" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="340" y="227" text-anchor="middle" fill="#3d2e0f" font-size="9" letter-spacing="1">SAME 4 BYTES · SAME NETWORK PACKET · WRONG BYTE ORDER ASSUMPTION = 16× WRONG VALUE</text>
</svg>
