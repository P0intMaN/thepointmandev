<svg xmlns="http://www.w3.org/2000/svg" width="680" height="210" viewBox="0 0 680 210" font-family="'Geist Mono', monospace">
  <rect width="680" height="210" fill="#0f0d09"/>

  <!-- Title -->
  <text x="340" y="20" text-anchor="middle" fill="#92400e" font-size="10" letter-spacing="2" font-weight="700">ONE BYTE — BIT POSITIONS AND PLACE VALUES</text>

  <!-- Column guides: 8 boxes at x = 40, 120, 200, 280, 360, 440, 520, 600, each 68px wide -->

  <!-- Bit position labels (row 1) -->
  <text x="74"  y="42" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">7</text>
  <text x="154" y="42" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">6</text>
  <text x="234" y="42" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">5</text>
  <text x="314" y="42" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">4</text>
  <text x="394" y="42" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">3</text>
  <text x="474" y="42" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">2</text>
  <text x="554" y="42" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">1</text>
  <text x="634" y="42" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">0</text>

  <!-- MSB / LSB labels -->
  <text x="74"  y="55" text-anchor="middle" fill="#3d2e0f" font-size="8">MSB</text>
  <text x="634" y="55" text-anchor="middle" fill="#3d2e0f" font-size="8">LSB</text>

  <!-- Bit boxes with value 10110010 = 178 -->
  <!-- Bit 7 = 1 (amber) -->
  <rect x="40"  y="60" width="68" height="52" rx="4" fill="#1f1608" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="74"  y="92" text-anchor="middle" fill="#fbbf24" font-size="28" font-weight="700">1</text>

  <!-- Bit 6 = 0 (dim) -->
  <rect x="120" y="60" width="68" height="52" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1.2"/>
  <text x="154" y="92" text-anchor="middle" fill="#b7b1b1" font-size="28" font-weight="700">0</text>

  <!-- Bit 5 = 1 -->
  <rect x="200" y="60" width="68" height="52" rx="4" fill="#1f1608" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="234" y="92" text-anchor="middle" fill="#fbbf24" font-size="28" font-weight="700">1</text>

  <!-- Bit 4 = 1 -->
  <rect x="280" y="60" width="68" height="52" rx="4" fill="#1f1608" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="314" y="92" text-anchor="middle" fill="#fbbf24" font-size="28" font-weight="700">1</text>

  <!-- Bit 3 = 0 -->
  <rect x="360" y="60" width="68" height="52" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1.2"/>
  <text x="394" y="92" text-anchor="middle" fill="#b7b1b1" font-size="28" font-weight="700">0</text>

  <!-- Bit 2 = 0 -->
  <rect x="440" y="60" width="68" height="52" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1.2"/>
  <text x="474" y="92" text-anchor="middle" fill="#b7b1b1" font-size="28" font-weight="700">0</text>

  <!-- Bit 1 = 1 -->
  <rect x="520" y="60" width="68" height="52" rx="4" fill="#1f1608" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="554" y="92" text-anchor="middle" fill="#fbbf24" font-size="28" font-weight="700">1</text>

  <!-- Bit 0 = 0 -->
  <rect x="600" y="60" width="68" height="52" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1.2"/>
  <text x="634" y="92" text-anchor="middle" fill="#b7b1b1" font-size="28" font-weight="700">0</text>

  <!-- Place value labels (row 3) -->
  <text x="74"  y="130" text-anchor="middle" fill="#67e8f9" font-size="10">128</text>
  <text x="154" y="130" text-anchor="middle" fill="#3d2e0f" font-size="10">64</text>
  <text x="234" y="130" text-anchor="middle" fill="#67e8f9" font-size="10">32</text>
  <text x="314" y="130" text-anchor="middle" fill="#67e8f9" font-size="10">16</text>
  <text x="394" y="130" text-anchor="middle" fill="#3d2e0f" font-size="10">8</text>
  <text x="474" y="130" text-anchor="middle" fill="#3d2e0f" font-size="10">4</text>
  <text x="554" y="130" text-anchor="middle" fill="#67e8f9" font-size="10">2</text>
  <text x="634" y="130" text-anchor="middle" fill="#3d2e0f" font-size="10">1</text>

  <text x="340" y="143" text-anchor="middle" fill="#3d2e0f" font-size="8" letter-spacing="1">↑ place value of each set bit</text>

  <!-- Divider -->
  <line x1="40" y1="152" x2="640" y2="152" stroke="#3d2e0f" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Sum -->
  <text x="340" y="168" text-anchor="middle" fill="#92400e" font-size="10" letter-spacing="1">AS UNSIGNED INTEGER</text>
  <text x="340" y="185" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700">128 + 32 + 16 + 2 = 178</text>

  <!-- Bottom annotation -->
  <text x="340" y="202" text-anchor="middle" fill="#3d2e0f" font-size="9" letter-spacing="1">BYTE 10110010  ·  BIT k CONTRIBUTES 2ᵏ  ·  RIGHT IS LOW, LEFT IS HIGH</text>
</svg>
