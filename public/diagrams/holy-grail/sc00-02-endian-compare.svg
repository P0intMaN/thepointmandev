<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" font-family="'Geist Mono', monospace">
  <rect width="680" height="270" fill="#0f0d09"/>

  <!-- Title -->
  <text x="340" y="20" text-anchor="middle" fill="#92400e" font-size="10" letter-spacing="2" font-weight="700">STORING 0x12345678 IN MEMORY AT ADDRESS 0x1000</text>

  <!-- ====== BIG-ENDIAN (top) ====== -->
  <text x="40" y="44" fill="#4ade80" font-size="11" font-weight="700">BIG-ENDIAN</text>
  <text x="40" y="57" fill="#3d2e0f" font-size="9">MSB at lowest address · "how humans write numbers"</text>

  <!-- 4 boxes -->
  <rect x="140" y="63" width="100" height="48" rx="4" fill="#0f1a0f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="190" y="84" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700">0x12</text>
  <text x="190" y="99" text-anchor="middle" fill="#3d2e0f" font-size="9">MSB</text>

  <rect x="250" y="63" width="100" height="48" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="300" y="84" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">0x34</text>

  <rect x="360" y="63" width="100" height="48" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="410" y="84" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">0x56</text>

  <rect x="470" y="63" width="100" height="48" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="520" y="84" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">0x78</text>
  <text x="520" y="99" text-anchor="middle" fill="#3d2e0f" font-size="9">LSB</text>

  <!-- Address labels below boxes -->
  <text x="190" y="124" text-anchor="middle" fill="#92400e" font-size="9">0x1000</text>
  <text x="300" y="124" text-anchor="middle" fill="#92400e" font-size="9">0x1001</text>
  <text x="410" y="124" text-anchor="middle" fill="#92400e" font-size="9">0x1002</text>
  <text x="520" y="124" text-anchor="middle" fill="#92400e" font-size="9">0x1003</text>

  <!-- Arrow: MSB → LSB -->
  <line x1="140" y1="138" x2="570" y2="138" stroke="#4ade80" stroke-width="1" marker-end="url(#arrowG)"/>
  <text x="355" y="150" text-anchor="middle" fill="#4ade80" font-size="8">increasing address →  (MSB first)</text>

  <!-- Divider -->
  <line x1="40" y1="162" x2="640" y2="162" stroke="#3d2e0f" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ====== LITTLE-ENDIAN (bottom) ====== -->
  <text x="40" y="182" fill="#f59e0b" font-size="11" font-weight="700">LITTLE-ENDIAN</text>
  <text x="40" y="195" fill="#3d2e0f" font-size="9">LSB at lowest address · x86, ARM, your laptop</text>

  <!-- 4 boxes — reversed byte order -->
  <rect x="140" y="200" width="100" height="48" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="190" y="221" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">0x78</text>
  <text x="190" y="236" text-anchor="middle" fill="#3d2e0f" font-size="9">LSB</text>

  <rect x="250" y="200" width="100" height="48" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="300" y="221" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">0x56</text>

  <rect x="360" y="200" width="100" height="48" rx="4" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="410" y="221" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">0x34</text>

  <rect x="470" y="200" width="100" height="48" rx="4" fill="#1f1608" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520" y="221" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">0x12</text>
  <text x="520" y="236" text-anchor="middle" fill="#92400e" font-size="9">MSB</text>

  <!-- Address labels -->
  <text x="190" y="260" text-anchor="middle" fill="#92400e" font-size="9">0x1000</text>
  <text x="300" y="260" text-anchor="middle" fill="#92400e" font-size="9">0x1001</text>
  <text x="410" y="260" text-anchor="middle" fill="#92400e" font-size="9">0x1002</text>
  <text x="520" y="260" text-anchor="middle" fill="#92400e" font-size="9">0x1003</text>

  <!-- Arrow marker def -->
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
  </defs>
</svg>
