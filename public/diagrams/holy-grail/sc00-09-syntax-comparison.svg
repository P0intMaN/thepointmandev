<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" font-family="'Geist Mono', monospace">
  <rect width="680" height="280" fill="#0f0d09"/>

  <!-- Title -->
  <text x="340" y="16" text-anchor="middle" fill="#92400e" font-size="10" letter-spacing="2" font-weight="700">INTEL vs AT&amp;T SYNTAX — IDENTICAL MACHINE CODE, TWO NOTATIONS</text>

  <!-- Column headers -->
  <rect x="10"  y="24" width="320" height="20" rx="2" fill="#1a1510" stroke="#f59e0b" stroke-width="1"/>
  <text x="170" y="38" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">Intel (dest ← src)</text>

  <rect x="340" y="24" width="330" height="20" rx="2" fill="#0c1518" stroke="#67e8f9" stroke-width="1"/>
  <text x="505" y="38" text-anchor="middle" fill="#67e8f9" font-size="10" font-weight="700">AT&amp;T (src → dest)</text>

  <!-- Row 1: register move -->
  <rect x="10"  y="48" width="320" height="30" rx="1" fill="#1a1510"/>
  <text x="20" y="60" fill="#3d2e0f" font-size="8">register→register</text>
  <text x="20" y="73" fill="#fef3c7" font-size="11">mov rax, rbx</text>

  <rect x="340" y="48" width="330" height="30" rx="1" fill="#120e08"/>
  <text x="350" y="60" fill="#3d2e0f" font-size="8">register→register (% sigil)</text>
  <text x="350" y="73" fill="#fef3c7" font-size="11">movq %rbx, %rax</text>

  <!-- Row 2: immediate -->
  <rect x="10"  y="82" width="320" height="30" rx="1" fill="#120e08"/>
  <text x="20" y="94" fill="#3d2e0f" font-size="8">immediate to register</text>
  <text x="20" y="107" fill="#fef3c7" font-size="11">mov rax, 42</text>

  <rect x="340" y="82" width="330" height="30" rx="1" fill="#1a1510"/>
  <text x="350" y="94" fill="#3d2e0f" font-size="8">$ = immediate, q = 64-bit</text>
  <text x="350" y="107" fill="#fef3c7" font-size="11">movq $42, %rax</text>

  <!-- Row 3: memory load -->
  <rect x="10"  y="116" width="320" height="30" rx="1" fill="#1a1510"/>
  <text x="20" y="128" fill="#3d2e0f" font-size="8">memory load (brackets)</text>
  <text x="20" y="141" fill="#fef3c7" font-size="11">mov rax, [rbx + 8]</text>

  <rect x="340" y="116" width="330" height="30" rx="1" fill="#120e08"/>
  <text x="350" y="128" fill="#3d2e0f" font-size="8">memory load (offset notation)</text>
  <text x="350" y="141" fill="#fef3c7" font-size="11">movq 8(%rbx), %rax</text>

  <!-- Row 4: memory store -->
  <rect x="10"  y="150" width="320" height="30" rx="1" fill="#120e08"/>
  <text x="20" y="162" fill="#3d2e0f" font-size="8">memory store</text>
  <text x="20" y="175" fill="#fef3c7" font-size="11">mov [rsp + 8], rax</text>

  <rect x="340" y="150" width="330" height="30" rx="1" fill="#1a1510"/>
  <text x="350" y="162" fill="#3d2e0f" font-size="8">memory store</text>
  <text x="350" y="175" fill="#fef3c7" font-size="11">movq %rax, 8(%rsp)</text>

  <!-- Key differences summary -->
  <line x1="10" y1="188" x2="668" y2="188" stroke="#3d2e0f" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="10" y="196" width="650" height="76" rx="3" fill="#1a1510" stroke="#3d2e0f" stroke-width="1"/>
  <text x="340" y="212" text-anchor="middle" fill="#92400e" font-size="9" font-weight="700">KEY DIFFERENCES</text>

  <text x="30" y="230" fill="#f59e0b" font-size="9" font-weight="700">Intel:</text>
  <text x="80" y="230" fill="#3d2e0f" font-size="9">destination first   no sigils   [base+offset]   no size suffix (inferred)</text>

  <text x="30" y="248" fill="#67e8f9" font-size="9" font-weight="700">AT&amp;T:</text>
  <text x="80" y="248" fill="#3d2e0f" font-size="9">source first        %reg  $imm   offset(%base)  q/l/w/b suffix required</text>

  <text x="30" y="266" fill="#fef3c7" font-size="9">Tools: objdump -d -M intel   |   GDB: set disassembly-flavor intel   |   JVM -XX:+PrintAssembly → Intel by default</text>
</svg>
