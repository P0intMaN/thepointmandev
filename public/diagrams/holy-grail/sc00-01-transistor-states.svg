<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" font-family="'Geist Mono', monospace">
  <rect width="680" height="220" fill="#0f0d09"/>

  <!-- LEFT: OFF state -->
  <g transform="translate(40, 20)">
    <!-- Label -->
    <text x="130" y="18" text-anchor="middle" fill="#92400e" font-size="10" letter-spacing="2" font-weight="700">OFF STATE</text>

    <!-- Transistor body -->
    <rect x="80" y="30" width="100" height="80" rx="6" fill="#1a1510" stroke="#3d2e0f" stroke-width="1.5"/>
    <text x="130" y="76" text-anchor="middle" fill="#92400e" font-size="11">transistor</text>

    <!-- Gate (left terminal) -->
    <line x1="20" y1="70" x2="80" y2="70" stroke="#3d2e0f" stroke-width="2"/>
    <text x="10" y="68" text-anchor="middle" fill="#92400e" font-size="9">G</text>

    <!-- Drain (top terminal) -->
    <line x1="130" y1="30" x2="130" y2="10" stroke="#3d2e0f" stroke-width="2"/>
    <text x="130" y="8" text-anchor="middle" fill="#92400e" font-size="9">D</text>

    <!-- Source (bottom terminal) -->
    <line x1="130" y1="110" x2="130" y2="135" stroke="#3d2e0f" stroke-width="2"/>
    <text x="130" y="148" text-anchor="middle" fill="#92400e" font-size="9">S</text>

    <!-- Voltage labels -->
    <rect x="68" y="55" width="60" height="20" rx="3" fill="#120e08" stroke="#3d2e0f" stroke-width="1"/>
    <text x="98" y="69" text-anchor="middle" fill="#f87171" font-size="10" font-weight="700">~0 V</text>

    <!-- Blocked current indicator -->
    <line x1="130" y1="10" x2="130" y2="135" stroke="#3d2e0f" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="155" y="74" fill="#f87171" font-size="18">⊘</text>
    <text x="148" y="88" fill="#92400e" font-size="9">blocked</text>

    <!-- Bit badge -->
    <rect x="80" y="155" width="100" height="32" rx="5" fill="#1a0f0f" stroke="#f87171" stroke-width="1.5"/>
    <text x="130" y="170" text-anchor="middle" fill="#f87171" font-size="10" letter-spacing="1">represents</text>
    <text x="130" y="183" text-anchor="middle" fill="#f87171" font-size="20" font-weight="900">0</text>
  </g>

  <!-- Divider -->
  <line x1="340" y1="15" x2="340" y2="205" stroke="#3d2e0f" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- RIGHT: ON state -->
  <g transform="translate(360, 20)">
    <!-- Label -->
    <text x="130" y="18" text-anchor="middle" fill="#f59e0b" font-size="10" letter-spacing="2" font-weight="700">ON STATE</text>

    <!-- Transistor body -->
    <rect x="80" y="30" width="100" height="80" rx="6" fill="#1f1608" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="130" y="76" text-anchor="middle" fill="#d97706" font-size="11">transistor</text>

    <!-- Gate (left terminal) -->
    <line x1="20" y1="70" x2="80" y2="70" stroke="#f59e0b" stroke-width="2"/>
    <text x="10" y="68" text-anchor="middle" fill="#f59e0b" font-size="9">G</text>

    <!-- Drain (top terminal) -->
    <line x1="130" y1="30" x2="130" y2="10" stroke="#f59e0b" stroke-width="2"/>
    <text x="130" y="8" text-anchor="middle" fill="#f59e0b" font-size="9">D</text>

    <!-- Source (bottom terminal) -->
    <line x1="130" y1="110" x2="130" y2="135" stroke="#f59e0b" stroke-width="2"/>
    <text x="130" y="148" text-anchor="middle" fill="#f59e0b" font-size="9">S</text>

    <!-- Voltage label -->
    <rect x="62" y="55" width="72" height="20" rx="3" fill="#1f1608" stroke="#f59e0b" stroke-width="1"/>
    <text x="98" y="69" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="700">~1.1 V</text>

    <!-- Flowing current arrows -->
    <text x="148" y="55" fill="#4ade80" font-size="13">↓</text>
    <text x="148" y="70" fill="#4ade80" font-size="13">↓</text>
    <text x="148" y="85" fill="#4ade80" font-size="13">↓</text>
    <text x="140" y="98" fill="#4ade80" font-size="9">current</text>
    <text x="143" y="109" fill="#4ade80" font-size="9">flows</text>

    <!-- Bit badge -->
    <rect x="80" y="155" width="100" height="32" rx="5" fill="#0f1a0f" stroke="#4ade80" stroke-width="1.5"/>
    <text x="130" y="170" text-anchor="middle" fill="#4ade80" font-size="10" letter-spacing="1">represents</text>
    <text x="130" y="183" text-anchor="middle" fill="#4ade80" font-size="20" font-weight="900">1</text>
  </g>

  <!-- Bottom label -->
  <text x="340" y="212" text-anchor="middle" fill="#3d2e0f" font-size="9" letter-spacing="1">ONE TRANSISTOR · TWO STABLE STATES · ONE BIT</text>
</svg>
