<svg xmlns="http://www.w3.org/2000/svg" width="680" height="195" viewBox="0 0 680 195" font-family="'Geist Mono', monospace">
  <rect width="680" height="195" fill="#0f0d09"/>

  <!-- Title -->
  <text x="340" y="17" text-anchor="middle" fill="#92400e" font-size="10" letter-spacing="2" font-weight="700">IEEE 754 — 32-BIT FLOAT BIT LAYOUT</text>

  <!-- Proportional field bars (total width 620, starting x=30) -->
  <!-- 1 bit sign, 8 bit exponent, 23 bit mantissa = 32 bits -->
  <!-- Proportional px: sign=19px, exponent=155px, mantissa=446px (total=620) -->

  <!-- Sign bit (1/32 of 620 = ~19px) -->
  <rect x="30" y="28" width="19" height="56" rx="3" fill="#1a0f0f" stroke="#f87171" stroke-width="1.5"/>
  <text x="39" y="52" text-anchor="middle" fill="#f87171" font-size="9" font-weight="700" writing-mode="tb">S</text>
  <text x="39" y="73" text-anchor="middle" fill="#f87171" font-size="8">1</text>

  <!-- Exponent (8/32 of 620 = 155px) -->
  <rect x="52" y="28" width="155" height="56" rx="3" fill="#1f1608" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="129" y="52" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="700">EXPONENT</text>
  <text x="129" y="67" text-anchor="middle" fill="#92400e" font-size="9">8 bits · biased by 127</text>
  <text x="129" y="78" text-anchor="middle" fill="#3d2e0f" font-size="8">bits 30–23</text>

  <!-- Mantissa (23/32 of 620 = 446px) -->
  <rect x="210" y="28" width="440" height="56" rx="3" fill="#0c1518" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="430" y="52" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="700">MANTISSA  (SIGNIFICAND)</text>
  <text x="430" y="67" text-anchor="middle" fill="#3d2e0f" font-size="9">23 bits · implicit leading 1 (gives 24 bits of precision)</text>
  <text x="430" y="78" text-anchor="middle" fill="#3d2e0f" font-size="8">bits 22–0</text>

  <!-- Bit position labels above -->
  <text x="39"  y="26" text-anchor="middle" fill="#3d2e0f" font-size="8">31</text>
  <text x="52"  y="26" text-anchor="start"  fill="#3d2e0f" font-size="8">30</text>
  <text x="210" y="26" text-anchor="start"  fill="#3d2e0f" font-size="8">22</text>
  <text x="648" y="26" text-anchor="end"    fill="#3d2e0f" font-size="8">0</text>

  <!-- Formula -->
  <line x1="30" y1="97" x2="650" y2="97" stroke="#3d2e0f" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="340" y="113" text-anchor="middle" fill="#92400e" font-size="9" letter-spacing="1">VALUE FORMULA</text>
  <text x="340" y="130" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="700">(−1)ˢ  ×  1.mantissa  ×  2^(exponent − 127)</text>

  <!-- Example: 1.5 -->
  <line x1="30" y1="143" x2="650" y2="143" stroke="#3d2e0f" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="340" y="157" text-anchor="middle" fill="#92400e" font-size="9" letter-spacing="1">EXAMPLE: 1.5f  =  0 01111111 10000000000000000000000  =  0x3FC00000</text>
  <text x="175" y="173" text-anchor="middle" fill="#f87171" font-size="9">S=0 (+)</text>
  <text x="340" y="173" text-anchor="middle" fill="#f59e0b" font-size="9">exp=127 → 127−127=0 → 2⁰=1</text>
  <text x="530" y="173" text-anchor="middle" fill="#67e8f9" font-size="9">mantissa=.1000... → 1.1 × 2⁰ = 1.5</text>

  <!-- Double precision note -->
  <text x="340" y="190" text-anchor="middle" fill="#3d2e0f" font-size="9" letter-spacing="1">DOUBLE (64-BIT): 1 SIGN · 11 EXPONENT (BIAS 1023) · 52 MANTISSA — SAME FORMULA</text>
</svg>
